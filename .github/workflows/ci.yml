name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :core:build :desktop:classes

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: core/build/reports/tests/test/

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Xvfb and Mesa software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0

      - name: Compile desktop
        run: ./gradlew :desktop:classes

      - name: Run smoke test
        id: smoke
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" ./gradlew :desktop:run --args='--smoke-test' > smoke-test.log 2>&1
        timeout-minutes: 5

      - name: Check smoke test result
        run: |
          if [ -f smoke-test-result.txt ]; then
            RESULT=$(cat smoke-test-result.txt)
            echo "Smoke test result: $RESULT"
            if [ "$RESULT" != "PASS" ]; then
              echo "::error::Smoke test failed"
              echo "$RESULT"
              exit 1
            fi
          else
            echo "::warning::No smoke-test-result.txt found, checking log for errors"
            if grep -q "SMOKE TEST FAILED" smoke-test.log; then
              echo "::error::Smoke test failed (detected from log)"
              exit 1
            fi
          fi

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-log
          path: smoke-test.log

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-screenshot
          path: smoke-test-screenshot.png
          if-no-files-found: ignore
