allprojects {
    apply plugin: "idea"

    version = '0.3.0'
    ext {
        appName = 'ShapeOfThingsThatWere'
        gdxVersion = '1.10.0'
        artemisVersion = '0.7.1'
        slf4jVersion = '1.7.30'
        log4jBindingsVersion = '2.13.3'
        log4jCoreVersion = '2.13.3'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

subprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

project(":desktop") {
    dependencies {
        implementation project(":core")
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
    }
}

project(":core") {
    dependencies {
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
        implementation "net.onedaybeard.artemis:artemis-odb:$artemisVersion"
        implementation "org.slf4j:slf4j-api:$slf4jVersion"
        implementation "org.apache.logging.log4j:log4j-slf4j-impl:$log4jBindingsVersion"
        implementation "org.apache.logging.log4j:log4j-core:$log4jCoreVersion"
    }
}

